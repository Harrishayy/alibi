<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alibi end card</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="cards.css">
<script src="pinch-data.js"></script>
<script src="../../pinch/rig.js"></script>
<script src="card.js"></script>
</head>
<body>
<main class="card">
  <div class="pinch-slot" id="pinch"></div>
  <h1 class="t-h1 end-name" id="name">Alibi</h1>
  <p class="t-body end-for" id="for">Built for the NVIDIA London Claw Agent Challenge</p>
  <p class="t-small end-witness" id="witness">Frames are judged on-device by Apple Vision.</p>
  <p class="t-mono end-url" id="url">github.com/Harrishayy/nvidia_habits</p>
</main>
<script>
/* DEMO.md §2 end: Pinch 160 idle, breathing · "Alibi" h1 · the challenge in body ink-2 · the honest witness line
   (?witness=, from ./alibi.sh status, DEMO.md §3) in small ink-3 · the URL (?url=) in small mono. Green is Pinch
   only; the lens stays dark because the camera is off. */
var q = new URLSearchParams(location.search);
if (q.get('witness')) document.getElementById('witness').textContent = q.get('witness');
if (q.has('url')) document.getElementById('url').textContent = q.get('url');
if (!document.getElementById('url').textContent) document.getElementById('url').hidden = true;
Card.init({ duration: 4000 });
var tok = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
var dm = parseFloat(tok('--dur-reveal'));
Card.enter(document.getElementById('pinch'), 0, { y: 8, scale: 0.96, dur: dm });
['name', 'for', 'witness', 'url'].forEach(function (id, i) {        // 40 ms stagger, content in from 6 px
  Card.enter(document.getElementById(id), 160 + 40 * i, { y: 6, blur: 4, dur: dm });
});
Card.pinch(document.getElementById('pinch'), { size: 160, mood: 'idle', blinks: [1500, 3150] });
Card.start();
</script>
</body>
</html>
