<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Island verdict</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alibi/components/bundle.css">
<script src="ds/alibi/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 800px; height: 460px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--surface-1);"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); font-size: 13px; line-height: 1;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="font-weight: 600;">Finder</span>
      <span>File</span>
      <span>Edit</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; font-variant-numeric: tabular-nums;">
      <span aria-hidden="true" style="position: relative; width: 22px; height: 11px; box-sizing: border-box; border: 1px solid var(--ink-2); border-radius: 3px;">
        <span style="position: absolute; left: 1px; top: 1px; bottom: 1px; width: 14px; border-radius: 1px; background: var(--ink);"></span>
      </span>
      <span>Thu 1 Oct</span>
      <span>19:42</span>
    </div>
  </div>
  <div role="status" aria-live="polite" aria-label="Verdict: done, 23 of 25 minutes" style="position: absolute; top: 0; left: 180px; width: 440px; box-sizing: border-box; padding: 0 12px 12px; display: flex; flex-direction: column; background: var(--island); border-radius: 0 0 28px 28px; box-shadow: var(--shadow-island);">
    <div aria-hidden="true" style="position: absolute; top: 0; left: -12px; width: 12px; height: 12px; overflow: hidden;">
      <div style="position: absolute; top: 0; left: -12px; width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 0 12px var(--island);"></div>
    </div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: 100%; width: 12px; height: 12px; overflow: hidden;">
      <div style="position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 0 12px var(--island);"></div>
    </div>
    <div style="height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px;">
      <span style="font-size: 12px; line-height: 1; font-weight: 800; letter-spacing: 1.6px; color: var(--ink);">ALIBI</span>
      <span style="font-size: 12px; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums;">Drawing · 19:41</span>
    </div>
    <div style="margin-top: 4px; padding: 0 4px; display: flex; align-items: flex-start; gap: 12px;">
      <x-import component-from-global-scope="Alibi.Pinch" mood="idle" play="celebrate" force="{{ yes }}" size="{{ pinch }}" theme="dark" style="display: flex; width: 64px; height: 64px; flex: none;"></x-import>
      <div style="min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px;">
        <x-import component-from-global-scope="Alibi.VerdictPill" verdict="done" ratio="{{ ratio }}" style="display: flex;"></x-import>
        <p style="margin: 0; font-size: 15px; line-height: 1.4; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); font-variant-numeric: tabular-nums; text-wrap: pretty;">23 of 25 minutes at the desk, pencil in hand.</p>
        <div style="margin-top: 4px; display: flex; gap: 8px;">
          <div role="img" aria-label="Frame at 19:22, on task" style="position: relative; width: 96px; height: 54px; box-sizing: border-box; overflow: hidden; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--hairline-strong); color: var(--ink-3);">
            <svg aria-hidden="true" viewBox="0 0 160 90" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; inset: 0;"><rect x="40" y="16" width="64" height="48" rx="3" transform="rotate(-6 72 40)"></rect><path d="M54 36c7-7 12 3 19-2s11 6 17 0"></path><path d="M56 48h22"></path><path d="M100 58l20-20"></path><ellipse cx="114" cy="64" rx="13" ry="8"></ellipse></svg>
            <span style="position: absolute; top: 5px; right: 5px; display: flex;"><x-import component-from-global-scope="Alibi.StatusDot" label="on_task" size="{{ fdot }}" style="display: flex;"></x-import></span>
            <span style="position: absolute; left: 4px; bottom: 4px; padding: 1px 4px; border-radius: 4px; background: var(--surface-1); box-shadow: 0 0 0 1px var(--hairline); font-size: 11px; line-height: 1.3; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums;">19:22</span>
          </div>
          <div role="img" aria-label="Frame at 19:29, phone" style="position: relative; width: 96px; height: 54px; box-sizing: border-box; overflow: hidden; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--hairline-strong); color: var(--ink-3);">
            <svg aria-hidden="true" viewBox="0 0 160 90" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; inset: 0;"><rect x="34" y="18" width="64" height="48" rx="3" transform="rotate(-6 66 42)" opacity="0.5"></rect><rect x="98" y="16" width="24" height="44" rx="5"></rect><path d="M106 22h8"></path><ellipse cx="110" cy="64" rx="16" ry="9"></ellipse></svg>
            <span style="position: absolute; top: 5px; right: 5px; display: flex;"><x-import component-from-global-scope="Alibi.StatusDot" label="phone" size="{{ fdot }}" style="display: flex;"></x-import></span>
            <span style="position: absolute; left: 4px; bottom: 4px; padding: 1px 4px; border-radius: 4px; background: var(--surface-1); box-shadow: 0 0 0 1px var(--hairline); font-size: 11px; line-height: 1.3; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums;">19:29</span>
          </div>
          <div role="img" aria-label="Frame at 19:38, on task" style="position: relative; width: 96px; height: 54px; box-sizing: border-box; overflow: hidden; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--hairline-strong); color: var(--ink-3);">
            <svg aria-hidden="true" viewBox="0 0 160 90" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; inset: 0;"><rect x="40" y="16" width="64" height="48" rx="3" transform="rotate(-6 72 40)"></rect><path d="M54 36c7-7 12 3 19-2s11 6 17 0"></path><path d="M56 48h22"></path><path d="M100 58l20-20"></path><ellipse cx="114" cy="64" rx="13" ry="8"></ellipse></svg>
            <span style="position: absolute; top: 5px; right: 5px; display: flex;"><x-import component-from-global-scope="Alibi.StatusDot" label="on_task" size="{{ fdot }}" style="display: flex;"></x-import></span>
            <span style="position: absolute; left: 4px; bottom: 4px; padding: 1px 4px; border-radius: 4px; background: var(--surface-1); box-shadow: 0 0 0 1px var(--hairline); font-size: 11px; line-height: 1.3; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums;">19:38</span>
          </div>
        </div>
      </div>
    </div>
    <div style="margin-top: 12px; padding: 0 4px 0 80px; display: flex; align-items: center; gap: 8px;">
      <x-import component-from-global-scope="Alibi.Button" variant="secondary" size="md" icon="eye" style="display: flex;">See proof</x-import>
      <x-import component-from-global-scope="Alibi.Button" variant="quiet" size="md" style="display: flex;">Fix a moment</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    return { pinch: 64, fdot: 8, ratio: 0.92, yes: true };
  }
}
</script>
</body>
</html>
