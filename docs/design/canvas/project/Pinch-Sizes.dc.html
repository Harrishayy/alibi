<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pinch sizes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alibi/components/bundle.css">
<script src="ds/alibi/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--ink-2)}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="dark" style="width: 1440px; height: 560px; box-sizing: border-box; padding: 28px 40px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">

  <header style="height: 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
    <div style="display: flex; align-items: baseline; gap: 16px; min-width: 0;">
      <h1 style="margin: 0; font-size: 22px; line-height: 1.25; font-weight: 600; letter-spacing: -0.015em;">Pinch sizes</h1>
      <p style="margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums;">Nine rungs, nothing in between. Below 24 Pinch is a five-shape silhouette: no antennae, mouth or lens.</p>
    </div>
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 28px; font-size: 13px; line-height: 1.45; text-decoration: none;">All boards</a>
  </header>

  <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
    <section data-theme="dark" aria-label="Size ladder on black" style="position: relative; height: 214px; box-sizing: border-box; padding: 0 20px 12px; display: flex; align-items: flex-end; justify-content: space-between; border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--bg); color: var(--ink);">
      <span style="position: absolute; top: 14px; left: 20px; font-size: 12px; line-height: 1.3; font-weight: 600; letter-spacing: 0.01em; color: var(--ink-2);">On black</span>
      <sc-for list="{{ ladder }}" as="r" hint-placeholder-count="9">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <x-import component-from-global-scope="Alibi.Pinch" mood="idle" size="{{ r.size }}" still="{{ r.still }}" theme="dark"></x-import>
          <span style="font-size: 12px; line-height: 1.3; font-weight: 600; letter-spacing: 0.01em; color: var(--ink-2); font-variant-numeric: tabular-nums;">{{ r.size }}</span>
        </div>
      </sc-for>
    </section>
    <section data-theme="light" aria-label="Size ladder on white" style="position: relative; height: 214px; box-sizing: border-box; padding: 0 20px 12px; display: flex; align-items: flex-end; justify-content: space-between; border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--surface-1); color: var(--ink);">
      <span style="position: absolute; top: 14px; left: 20px; font-size: 12px; line-height: 1.3; font-weight: 600; letter-spacing: 0.01em; color: var(--ink-2);">On white</span>
      <sc-for list="{{ ladder }}" as="r" hint-placeholder-count="9">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <x-import component-from-global-scope="Alibi.Pinch" mood="idle" size="{{ r.size }}" still="{{ r.still }}" theme="light"></x-import>
          <span style="font-size: 12px; line-height: 1.3; font-weight: 600; letter-spacing: 0.01em; color: var(--ink-2); font-variant-numeric: tabular-nums;">{{ r.size }}</span>
        </div>
      </sc-for>
    </section>
  </div>

  <div style="margin-top: 20px; display: flex; gap: 16px; align-items: flex-start;">

    <div style="width: 284px; flex: none; display: flex; flex-direction: column; gap: 12px;">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
        <div style="position: relative; height: 79px; border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden;">
          <div role="img" aria-label="Notch island with wings: Pinch on the left, 24 minutes left on the right" style="position: absolute; top: 0; left: 3px; width: 277px; height: 32px; box-sizing: border-box; display: grid; grid-template-columns: 46px 185px 46px; align-items: center; background: var(--island); border-radius: 0 0 12px 12px;">
            <span style="display: flex; justify-content: center;"><x-import component-from-global-scope="Alibi.Pinch" mood="focused" size="{{ s16 }}" still="{{ yes }}" theme="dark"></x-import></span>
            <span></span>
            <span style="text-align: center; font-family: var(--font-rounded); font-size: 13px; line-height: 1.2; font-weight: 600; color: var(--accent-ink); font-variant-numeric: tabular-nums;">24m</span>
          </div>
        </div>
        <figcaption style="display: flex; justify-content: space-between; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums;"><span>Notch wing, still</span><span style="color: var(--ink-3);">16 pt</span></figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
        <div style="height: 79px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--surface-2);">
          <div role="img" aria-label="Dynamic Island compact: Pinch on the left, 18:42 on the right" style="width: 230px; height: 37px; box-sizing: border-box; padding: 0 12px 0 9px; display: flex; align-items: center; justify-content: space-between; border-radius: var(--radius-pill); background: var(--island);">
            <x-import component-from-global-scope="Alibi.Pinch" mood="focused" size="{{ s20 }}" still="{{ yes }}" theme="dark"></x-import>
            <span style="width: 40px; text-align: right; font-family: var(--font-rounded); font-size: 14px; line-height: 1; font-weight: 600; color: var(--accent-ink); font-variant-numeric: tabular-nums;">18:42</span>
          </div>
        </div>
        <figcaption style="display: flex; justify-content: space-between; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums;"><span>Live Activity, compact</span><span style="color: var(--ink-3);">20 pt</span></figcaption>
      </figure>
    </div>

    <figure style="width: 160px; flex: none; margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 196px; border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden; display: flex; justify-content: center;">
        <div style="width: 148px; height: 164px; box-sizing: border-box; padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--island); border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
          <div style="display: flex; align-items: center; justify-content: space-between; height: 28px;">
            <span class="al-wordmark">ALIBI</span>
            <x-import component-from-global-scope="Alibi.Pinch" mood="focused" size="{{ s28 }}" theme="dark"></x-import>
          </div>
          <span class="al-island-title">Drawing</span>
          <span style="font-family: var(--font-rounded); font-size: 34px; line-height: 1; font-weight: 600; letter-spacing: -0.015em; color: var(--ink); font-variant-numeric: tabular-nums;">18:42</span>
          <span class="al-island-secondary" style="font-variant-numeric: tabular-nums;">On task 92%</span>
        </div>
      </div>
      <figcaption style="display: flex; justify-content: space-between; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums;"><span>Island panel</span><span style="color: var(--ink-3);">28 pt</span></figcaption>
    </figure>

    <figure style="width: 246px; flex: none; margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 196px; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; border-radius: var(--radius-sm); background: var(--surface-2);">
        <div role="img" aria-label="Lock Screen Live Activity: Drawing, 18:42 left, on task 92%" style="width: 100%; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 10px; border-radius: var(--radius-lg); background: var(--island);">
          <div style="display: flex; align-items: center; gap: 8px;">
            <x-import component-from-global-scope="Alibi.Pinch" mood="focused" size="{{ s32 }}" still="{{ yes }}" theme="dark"></x-import>
            <span style="flex: 1; min-width: 0; font-size: 15px; line-height: 1.3; font-weight: 600; color: var(--ink);">Drawing</span>
            <span style="font-family: var(--font-rounded); font-size: 34px; line-height: 1; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums;">18:42</span>
          </div>
          <div style="position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden;">
            <div style="position: absolute; inset: 0; border-radius: 3px; background: var(--accent); transform: scaleX(0.25); transform-origin: 0 50%;"></div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap;">
            <x-import component-from-global-scope="Alibi.StatusDot" label="on_task" size="{{ dot }}"></x-import>
            <span>On task 92% · last seen 19:38</span>
          </div>
        </div>
      </div>
      <figcaption style="display: flex; justify-content: space-between; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums;"><span>Lock Screen</span><span style="color: var(--ink-3);">32 pt</span></figcaption>
    </figure>

    <figure style="width: 200px; flex: none; margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 196px; box-sizing: border-box; padding: 0 6px; border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden;">
      <div style="height: 184px; box-sizing: border-box; padding: 12px 12px 12px; display: flex; flex-direction: column; gap: 8px; border-radius: 0 0 var(--radius-xl) var(--radius-xl); background: var(--island);">
        <x-import component-from-global-scope="Alibi.Pinch" mood="focused" size="{{ s56 }}" play="sideeye" theme="dark"></x-import>
        <p class="al-island-voice" style="font-variant-numeric: tabular-nums;">You said drawing. I've seen your <span style="color: var(--warn-ink);">phone</span> for 3 minutes.</p>
        <div style="margin-top: auto;">
          <x-import component-from-global-scope="Alibi.Button" variant="primary" size="sm">Back to it</x-import>
        </div>
      </div>
      </div>
      <figcaption style="display: flex; justify-content: space-between; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums;"><span>Nudge alert</span><span style="color: var(--ink-3);">56 pt</span></figcaption>
    </figure>

    <figure style="width: 220px; flex: none; margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 196px; box-sizing: border-box; padding: 0 6px; border-radius: var(--radius-sm); background: var(--surface-2); overflow: hidden;">
      <div style="height: 160px; box-sizing: border-box; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px; border-radius: 0 0 var(--radius-xl) var(--radius-xl); background: var(--island);">
        <div style="display: flex; align-items: center; gap: 12px;">
          <x-import component-from-global-scope="Alibi.Pinch" mood="idle" size="{{ s64 }}" play="celebrate" theme="dark"></x-import>
          <x-import component-from-global-scope="Alibi.VerdictPill" verdict="done" ratio="{{ ratio }}"></x-import>
        </div>
        <p class="al-island-voice" style="font-variant-numeric: tabular-nums;">Done. 23 of 25 minutes at the desk, pencil in hand.</p>
      </div>
      </div>
      <figcaption style="display: flex; justify-content: space-between; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums;"><span>Verdict alert</span><span style="color: var(--ink-3);">64 pt</span></figcaption>
    </figure>


    <figure style="width: 170px; flex: none; margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 196px; box-sizing: border-box; padding: 6px 0 0; display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: var(--radius-sm); background: var(--bg); border: 1px solid var(--hairline); overflow: hidden;">
        <x-import component-from-global-scope="Alibi.Pinch" mood="focused" size="{{ s160 }}" theme="dark"></x-import>
        <span style="font-size: 12px; line-height: 1.3; font-weight: 600; letter-spacing: 0.01em; color: var(--ink); font-variant-numeric: tabular-nums;">Drawing · 18:42 left</span>
      </div>
      <figcaption style="display: flex; justify-content: space-between; font-size: 13px; line-height: 1.45; color: var(--ink-2); font-variant-numeric: tabular-nums;"><span>iPhone Today</span><span style="color: var(--ink-3);">160 pt</span></figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      ladder: [16, 20, 28, 32, 44, 56, 64, 96, 160].map((size) => ({ size: size, still: size < 24 })),
      s16: 16, s20: 20, s28: 28, s32: 32, s56: 56, s64: 64, s160: 160,
      ratio: 0.92,
      dot: 12
    };
  }
}
</script>
</body>
</html>
