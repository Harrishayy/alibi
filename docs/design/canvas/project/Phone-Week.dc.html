<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Week</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alibi/components/bundle.css">
<script src="ds/alibi/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
@keyframes ph-rise{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes ph-dot{from{opacity:0;transform:scale(0.6)}to{opacity:1;transform:none}}
@keyframes ph-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</helmet>
<div data-theme="{{ theme }}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased;">

<div style="position: absolute; top: 59px; left: 0; right: 0; height: 44px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: flex-end;">
<x-import component-from-global-scope="Alibi.IconButton" icon="settings" sc-camel-aria-label="Settings" size="lg"></x-import>
</div>

<main style="position: absolute; top: 103px; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 0 20px 120px; display: flex; flex-direction: column;">

<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; animation: ph-rise var(--dur-medium) var(--ease-out) both;">
<div>
<h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 600; letter-spacing: 0;">Week</h1>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums;">Fri 25 Sep to Thu 1 Oct</p>
</div>
<div style="flex: none; padding-bottom: 2px; white-space: nowrap;"><x-import component-from-global-scope="Alibi.StreakBadge" days="{{ streak }}" freezes="{{ freezes }}"></x-import></div>
</header>

<section aria-label="Weekly report" style="margin-top: 14px; animation: ph-rise var(--dur-medium) var(--ease-out) 40ms both;">
<x-import component-from-global-scope="Alibi.PinchLine" mood="reading">You claimed 7h 30m. I saw 6h 22m. Drawing carried the week.</x-import>
</section>

<section aria-labelledby="days-h" style="margin-top: 16px; box-sizing: border-box; padding: 14px 16px 12px; border-radius: var(--radius-md); background: var(--surface-1); box-shadow: inset 0 0 0 1px var(--hairline); animation: ph-rise var(--dur-medium) var(--ease-out) 80ms both;">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 26px); column-gap: 4px; align-items: center;">
<h2 id="days-h" style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: 0;">Last 7 days</h2>
<sc-for list="{{ dayHeads }}" as="d" hint-placeholder-count="7">
<span style="height: 20px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-xs); font-size: 12px; line-height: 16px; font-weight: 600; color: {{ d.ink }}; background: {{ d.bg }};">{{ d.letter }}</span>
</sc-for>
</div>
<sc-for list="{{ grid }}" as="row" hint-placeholder-count="5">
<div style="margin-top: 2px; height: 28px; display: grid; grid-template-columns: minmax(0, 1fr) repeat(7, 26px); column-gap: 4px; align-items: center; border-top: 1px solid var(--hairline);">
<span style="font-size: 15px; line-height: 20px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ row.name }}</span>
<sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="7">
<span role="img" aria-label="{{ c.label }}" style="height: 26px; display: flex; align-items: center; justify-content: center; animation: ph-dot var(--spring-snappy-dur) var(--spring-snappy) {{ c.delay }} both;">
<sc-if value="{{ c.done }}" hint-placeholder-val="{{ true }}">
<span style="width: 12px; height: 12px; border-radius: var(--radius-pill); background: var(--on-task);"></span>
</sc-if>
<sc-if value="{{ c.partly }}" hint-placeholder-val="{{ false }}">
<span style="position: relative; width: 12px; height: 12px; box-sizing: border-box; border-radius: var(--radius-pill); border: 1.5px solid var(--partial); overflow: hidden;"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: var(--partial);"></span></span>
</sc-if>
<sc-if value="{{ c.slacked }}" hint-placeholder-val="{{ false }}">
<svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3 L11 11 M11 3 L3 11" stroke="var(--warn-ink)" stroke-width="2.2" stroke-linecap="round" fill="none"></path></svg>
</sc-if>
<sc-if value="{{ c.todo }}" hint-placeholder-val="{{ false }}">
<span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: var(--radius-pill); border: 1.5px solid var(--ink-3);"></span>
</sc-if>
<sc-if value="{{ c.rest }}" hint-placeholder-val="{{ false }}">
<span style="width: 8px; height: 2px; border-radius: var(--radius-pill); background: var(--surface-3);"></span>
</sc-if>
</span>
</sc-for>
</div>
</sc-for>
<div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hairline); display: flex; flex-wrap: wrap; column-gap: 14px; row-gap: 4px; font-size: 12px; line-height: 16px; color: var(--ink-2);">
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 9px; height: 9px; border-radius: var(--radius-pill); background: var(--on-task);"></span>Done</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="position: relative; width: 9px; height: 9px; box-sizing: border-box; border-radius: var(--radius-pill); border: 1.5px solid var(--partial); overflow: hidden;"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: var(--partial);"></span></span>Partly</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><svg width="9" height="9" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3 L11 11 M11 3 L3 11" stroke="var(--warn-ink)" stroke-width="2.4" stroke-linecap="round" fill="none"></path></svg>Slacked</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 9px; height: 9px; box-sizing: border-box; border-radius: var(--radius-pill); border: 1.5px solid var(--ink-3);"></span>To do</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 2px; border-radius: var(--radius-pill); background: var(--surface-3);"></span>Rest</span>
</div>
</section>

<section aria-labelledby="cvs-h" style="margin-top: 12px; box-sizing: border-box; padding: 14px 16px 16px; border-radius: var(--radius-md); background: var(--surface-1); box-shadow: inset 0 0 0 1px var(--hairline); display: flex; flex-direction: column; gap: 10px; animation: ph-rise var(--dur-medium) var(--ease-out) 120ms both;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<h2 id="cvs-h" style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: 0;">Claimed vs seen</h2>
<div style="display: flex; gap: 12px; font-size: 12px; line-height: 16px; color: var(--ink-2);">
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 12px; height: 6px; box-sizing: border-box; border-radius: 2px; border: 1.5px solid var(--hairline-strong);"></span>Claimed</span>
<span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 12px; height: 6px; border-radius: 2px; background: var(--accent);"></span>Seen</span>
</div>
</div>
<sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 5px;">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
<span style="font-size: 15px; line-height: 20px;">{{ b.name }}</span>
<span style="font-size: 13px; line-height: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums;"><span style="color: var(--ink); font-weight: 600;">{{ b.seen }}</span> of {{ b.claimed }}</span>
</div>
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 3px;">
<span style="display: block; height: 7px; width: {{ b.claimedW }}; box-sizing: border-box; border-radius: 3px; border: 1.5px solid var(--hairline-strong); transform-origin: left center; animation: ph-grow var(--dur-reveal) var(--ease-out) {{ b.delay }} both;"></span>
<span style="display: block; height: 7px; width: {{ b.seenW }}; border-radius: 3px; background: var(--accent); transform-origin: left center; animation: ph-grow var(--dur-reveal) var(--ease-out) {{ b.delay2 }} both;"></span>
</div>
</div>
</sc-for>
</section>

</main>

<nav aria-label="Alibi tabs" style="position: absolute; left: 24px; right: 24px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 5px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; border-radius: var(--radius-pill); background: var(--surface-1); box-shadow: var(--shadow-float), inset 0 0 0 1px var(--hairline);">
<a href="Phone-Today-Live.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: var(--radius-pill); color: var(--ink-2); text-decoration: none;">
<x-import component-from-global-scope="Alibi.Icon" name="clock" size="{{ tabIcon }}"></x-import>
<span style="font-size: 11px; line-height: 13px; font-weight: 600;">Today</span>
</a>
<a href="Phone-Week.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: var(--radius-pill); background: var(--surface-3); color: var(--accent-ink); text-decoration: none;">
<x-import component-from-global-scope="Alibi.Icon" name="calendar" size="{{ tabIcon }}"></x-import>
<span style="font-size: 11px; line-height: 13px; font-weight: 600;">Week</span>
</a>
<a href="Phone-Health.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: var(--radius-pill); color: var(--ink-2); text-decoration: none;">
<x-import component-from-global-scope="Alibi.Icon" name="heart" size="{{ tabIcon }}"></x-import>
<span style="font-size: 11px; line-height: 13px; font-weight: 600;">Health</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = [
      { letter: 'F', name: 'Friday 25' },
      { letter: 'S', name: 'Saturday 26' },
      { letter: 'S', name: 'Sunday 27' },
      { letter: 'M', name: 'Monday 28' },
      { letter: 'T', name: 'Tuesday 29' },
      { letter: 'W', name: 'Wednesday 30' },
      { letter: 'T', name: 'Today' }
    ];
    const words = { done: 'done', partly: 'partly', slacked: 'slacked', todo: 'to do', rest: 'rest day' };
    const habits = [
      { name: 'Drawing', week: ['done', 'rest', 'partly', 'done', 'done', 'done', 'done'] },
      { name: 'C++', week: ['done', 'rest', 'rest', 'done', 'slacked', 'done', 'todo'] },
      { name: 'Internship apps', week: ['partly', 'rest', 'rest', 'done', 'done', 'rest', 'done'] },
      { name: 'Running', week: ['done', 'rest', 'done', 'rest', 'done', 'rest', 'done'] },
      { name: 'Sleep', week: ['done', 'done', 'done', 'done', 'partly', 'done', 'done'] }
    ];
    const grid = habits.map((h, r) => ({
      name: h.name,
      cells: h.week.map((st, i) => ({
        label: days[i].name + ', ' + words[st],
        done: st === 'done', partly: st === 'partly', slacked: st === 'slacked', todo: st === 'todo', rest: st === 'rest',
        delay: (140 + Math.min(r * 7 + i, 5) * 40) + 'ms'
      }))
    }));
    const scale = 180;
    const rows = [
      { name: 'Drawing', claimed: 150, seen: 138 },
      { name: 'C++', claimed: 120, seen: 90 },
      { name: 'Internship apps', claimed: 180, seen: 154 }
    ];
    const fmt = (m) => Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
    return {
      theme: this.props.theme ?? 'dark',
      dayHeads: days.map((d, i) => ({
        letter: d.letter,
        ink: i === 6 ? 'var(--ink)' : 'var(--ink-3)',
        bg: i === 6 ? 'var(--surface-3)' : 'transparent'
      })),
      grid: grid,
      bars: rows.map((b, i) => ({
        name: b.name,
        claimed: fmt(b.claimed),
        seen: fmt(b.seen),
        claimedW: (b.claimed / scale * 100).toFixed(1) + '%',
        seenW: (b.seen / scale * 100).toFixed(1) + '%',
        delay: (200 + i * 40) + 'ms',
        delay2: (260 + i * 40) + 'ms'
      })),
      streak: 7,
      freezes: 1,
      tabIcon: 24
    };
  }
}
</script>
</body>
</html>
