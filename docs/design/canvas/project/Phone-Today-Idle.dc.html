<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Today, idle</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alibi/components/bundle.css">
<script src="ds/alibi/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
@keyframes ph-rise{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
</style>
</helmet>
<div data-theme="{{ theme }}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased;">

<div style="position: absolute; top: 59px; left: 0; right: 0; height: 44px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: flex-end;">
<x-import component-from-global-scope="Alibi.IconButton" icon="settings" sc-camel-aria-label="Settings" size="lg"></x-import>
</div>

<main style="position: absolute; top: 103px; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 0 20px 120px; display: flex; flex-direction: column;">

<header style="animation: ph-rise var(--dur-medium) var(--ease-out) both;">
<h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 600; letter-spacing: 0;">Today</h1>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-2);">Thursday 1 October · nothing running</p>
</header>

<section aria-label="So far today" style="margin-top: 8px; display: flex; align-items: center; gap: 12px; animation: ph-rise var(--dur-medium) var(--ease-out) 40ms both;">
<x-import component-from-global-scope="Alibi.Pinch" mood="idle" size="{{ pinchSize }}" theme="{{ theme }}"></x-import>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
<p style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: 0; font-variant-numeric: tabular-nums; text-wrap: balance;">Claimed 1h 10m. Seen 1h 04m.</p>
<p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums;">
<x-import component-from-global-scope="Alibi.Icon" name="calendar" size="{{ icon16 }}"></x-import>
<span>C++ next, 20:30</span>
</p>
</div>
</section>

<section aria-labelledby="start-h" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px; animation: ph-rise var(--dur-medium) var(--ease-out) 80ms both;">
<h2 id="start-h" style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-2);">Start on your Mac</h2>
<div style="display: flex; gap: 8px;">
<x-import component-from-global-scope="Alibi.Chip" icon="play" selected="{{ yes }}" style="min-height: 44px;">C++</x-import>
<x-import component-from-global-scope="Alibi.Chip" icon="play" style="min-height: 44px;">Drawing</x-import>
<x-import component-from-global-scope="Alibi.Chip" icon="play" style="min-height: 44px;">Internship apps</x-import>
</div>
</section>

<section aria-labelledby="habits-h" style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px; animation: ph-rise var(--dur-medium) var(--ease-out) 120ms both;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<h2 id="habits-h" style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: 0;">Habits <span style="margin-left: 4px; color: var(--ink-2); font-weight: 400; font-variant-numeric: tabular-nums;">4 of 5 done</span></h2>
<x-import component-from-global-scope="Alibi.StreakBadge" days="{{ streak }}" freezes="{{ freezes }}"></x-import>
</div>

<ul style="list-style: none; margin: 0; padding: 0 16px; background: var(--surface-1); border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--hairline);">
<sc-for list="{{ habits }}" as="h" hint-placeholder-count="5">
<li style="min-height: 54px; display: flex; align-items: center; gap: 12px; border-top: {{ h.rule }};">
<span style="width: 32px; height: 32px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--ink-2);"><x-import component-from-global-scope="Alibi.Icon" name="{{ h.icon }}" size="{{ icon16 }}"></x-import></span>
<div style="flex: 1; min-width: 0;">
<div style="font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: 0;">{{ h.name }}</div>
<div style="font-size: 13px; line-height: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ h.meta }}</div>
</div>
<sc-if value="{{ h.done }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="Alibi.VerdictPill" verdict="done"></x-import>
</sc-if>
<sc-if value="{{ h.todo }}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--radius-pill); box-shadow: inset 0 0 0 1px var(--hairline-strong); font-size: 13px; font-weight: 600; color: var(--ink-2);"><span aria-hidden="true" style="width: 9px; height: 9px; box-sizing: border-box; border-radius: var(--radius-pill); border: 1.5px solid var(--ink-2);"></span>To do</span>
</sc-if>
</li>
</sc-for>
</ul>
</section>

</main>

<nav aria-label="Alibi tabs" style="position: absolute; left: 24px; right: 24px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 5px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; border-radius: var(--radius-pill); background: var(--surface-1); box-shadow: var(--shadow-float), inset 0 0 0 1px var(--hairline);">
<a href="Phone-Today-Idle.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: var(--radius-pill); background: var(--surface-3); color: var(--accent-ink); text-decoration: none;">
<x-import component-from-global-scope="Alibi.Icon" name="clock" size="{{ tabIcon }}"></x-import>
<span style="font-size: 11px; line-height: 13px; font-weight: 600;">Today</span>
</a>
<a href="Phone-Week.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: var(--radius-pill); color: var(--ink-2); text-decoration: none;">
<x-import component-from-global-scope="Alibi.Icon" name="calendar" size="{{ tabIcon }}"></x-import>
<span style="font-size: 11px; line-height: 13px; font-weight: 600;">Week</span>
</a>
<a href="Phone-Health.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: var(--radius-pill); color: var(--ink-2); text-decoration: none;">
<x-import component-from-global-scope="Alibi.Icon" name="heart" size="{{ tabIcon }}"></x-import>
<span style="font-size: 11px; line-height: 13px; font-weight: 600;">Health</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { name: 'Sleep', icon: 'moon', meta: '7h 24m · iPhone Health', state: 'done' },
      { name: 'Running', icon: 'run', meta: '5.2 km in 27:48 · Strava, 07:40', state: 'done' },
      { name: 'Internship apps', icon: 'laptop', meta: '41 of 45 min seen · 14:10', state: 'done' },
      { name: 'Drawing', icon: 'camera', meta: '23 of 25 min seen · 19:21', state: 'done' },
      { name: 'C++', icon: 'laptop', meta: 'Planned 20:30 · 30 min', state: 'todo' }
    ];
    return {
      theme: this.props.theme ?? 'dark',
      habits: rows.map((r, i) => ({
        ...r,
        done: r.state === 'done',
        todo: r.state === 'todo',
        rule: i === 0 ? 'none' : '1px solid var(--hairline)'
      })),
      pinchSize: 160,
      streak: 7,
      freezes: 1,
      icon16: 16,
      tabIcon: 24,
      yes: true
    };
  }
}
</script>
</body>
</html>
