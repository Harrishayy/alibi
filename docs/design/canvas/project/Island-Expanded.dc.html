<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Island expanded</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alibi/components/bundle.css">
<script src="ds/alibi/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 800px; height: 560px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--surface-1);"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); font-size: 13px; line-height: 1;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="font-weight: 600;">Finder</span>
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; font-variant-numeric: tabular-nums;">
      <span aria-hidden="true" style="position: relative; width: 22px; height: 11px; box-sizing: border-box; border: 1px solid var(--ink-2); border-radius: 3px;">
        <span style="position: absolute; left: 1px; top: 1px; bottom: 1px; width: 14px; border-radius: 1px; background: var(--ink);"></span>
      </span>
      <span>Thu 1 Oct</span>
      <span>19:22</span>
    </div>
  </div>
  <div role="region" aria-label="Alibi island, expanded: Drawing, 18 minutes left, 92% on task" style="position: absolute; top: 0; left: 200px; width: 400px; box-sizing: border-box; padding: 0 12px 12px; display: flex; flex-direction: column; background: var(--island); border-radius: 0 0 28px 28px; box-shadow: var(--shadow-island);">
    <div aria-hidden="true" style="position: absolute; top: 0; left: -12px; width: 12px; height: 12px; overflow: hidden;">
      <div style="position: absolute; top: 0; left: -12px; width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 0 12px var(--island);"></div>
    </div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: 100%; width: 12px; height: 12px; overflow: hidden;">
      <div style="position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 0 12px var(--island);"></div>
    </div>
    <div style="height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <x-import component-from-global-scope="Alibi.Pinch" mood="focused" size="{{ head }}" theme="dark" style="display: flex; width: 28px; height: 28px;"></x-import>
        <span style="font-size: 12px; line-height: 1; font-weight: 800; letter-spacing: 1.6px; color: var(--ink);">ALIBI</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <x-import component-from-global-scope="Alibi.IconButton" icon="calendar" sc-camel-aria-label="Today's plan" size="sm" style="display: flex;"></x-import>
        <x-import component-from-global-scope="Alibi.IconButton" icon="settings" sc-camel-aria-label="Setup" size="sm" style="display: flex;"></x-import>
      </div>
    </div>
    <div style="margin-top: 8px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 16px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
        <span style="font-size: 17px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em;">Drawing</span>
        <span style="font-size: 12px; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums;">25 min · started 19:16</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <x-import component-from-global-scope="Alibi.RingTimer" progress="{{ ring }}" value="18:42" caption="left of 25 min" size="{{ ringSize }}" style="display: flex; width: 44px; height: 44px; flex: none;"></x-import>
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-family: var(--font-rounded); font-size: 34px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">18:42</span>
          <span style="font-size: 12px; line-height: 1.3; color: var(--ink-2);">left of 25 min</span>
        </div>
        <div style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
          <span style="font-family: var(--font-rounded); font-size: 17px; line-height: 1; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--ink);">92%</span>
          <span style="font-size: 12px; line-height: 1.3; color: var(--ink-2);">on task</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <x-import component-from-global-scope="Alibi.SampleStrip" labels="{{ strip }}" size="{{ stripSize }}" style="display: flex;"></x-import>
        <span style="font-size: 12px; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums;">Last seen 19:22</span>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 1.4; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); text-wrap: pretty;">Sketchbook open, pencil moving. Carry on.</p>
    </div>
    <div style="margin-top: 12px; padding: 0 4px; display: flex; align-items: center; gap: 8px;">
      <x-import component-from-global-scope="Alibi.Button" variant="secondary" size="md" icon="cup" style="display: flex;">Break</x-import>
      <x-import component-from-global-scope="Alibi.Button" variant="secondary" size="md" icon="plus" style="display: flex;">10 min</x-import>
      <x-import component-from-global-scope="Alibi.Button" variant="secondary" size="md" icon="stop" style="display: flex;">Finish</x-import>
    </div>
    <div style="margin-top: 12px; padding: 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; line-height: 1.3; color: var(--ink-2);">
      <span role="img" aria-label="3 of 5 habits done today" style="display: flex; align-items: center; gap: 8px;">
        <span aria-hidden="true" style="display: flex; align-items: center; gap: 4px;">
          <x-import component-from-global-scope="Alibi.StatusDot" label="on_task" size="{{ dot }}" style="display: flex;"></x-import>
          <x-import component-from-global-scope="Alibi.StatusDot" label="on_task" size="{{ dot }}" style="display: flex;"></x-import>
          <x-import component-from-global-scope="Alibi.StatusDot" label="on_task" size="{{ dot }}" style="display: flex;"></x-import>
          <x-import component-from-global-scope="Alibi.StatusDot" label="absent" size="{{ dot }}" style="display: flex;"></x-import>
          <x-import component-from-global-scope="Alibi.StatusDot" label="absent" size="{{ dot }}" style="display: flex;"></x-import>
        </span>
        <span style="font-variant-numeric: tabular-nums;">3 of 5 today</span>
      </span>
      <span style="font-variant-numeric: tabular-nums;">Next up: Internship apps at 20:30</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return { head: 28, ring: 0.25, ringSize: 44, strip: ['on_task', 'on_task', 'on_task', 'idle', 'on_task', 'on_task'], stripSize: 16, dot: 8 };
  }
}
</script>
</body>
</html>
