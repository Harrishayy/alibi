<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Island nudge</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alibi/components/bundle.css">
<script src="ds/alibi/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 800px; height: 420px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--surface-1);"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); font-size: 13px; line-height: 1;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="font-weight: 600;">Finder</span>
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; font-variant-numeric: tabular-nums;">
      <span aria-hidden="true" style="position: relative; width: 22px; height: 11px; box-sizing: border-box; border: 1px solid var(--ink-2); border-radius: 3px;">
        <span style="position: absolute; left: 1px; top: 1px; bottom: 1px; width: 14px; border-radius: 1px; background: var(--ink);"></span>
      </span>
      <span>Thu 1 Oct</span>
      <span>19:31</span>
    </div>
  </div>
  <div role="status" aria-live="polite" aria-labelledby="nudge-line" style="position: absolute; top: 0; left: 200.0px; width: 400px; height: 152px; box-sizing: border-box; padding: 0 12px 12px; display: flex; flex-direction: column; background: var(--island); border-radius: 0 0 28px 28px; box-shadow: var(--shadow-island);">
    <div aria-hidden="true" style="position: absolute; top: 0; left: -12px; width: 12px; height: 12px; overflow: hidden;">
      <div style="position: absolute; top: 0; left: -12px; width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 0 12px var(--island);"></div>
    </div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: 100%; width: 12px; height: 12px; overflow: hidden;">
      <div style="position: absolute; top: 0; left: 0; width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 0 12px var(--island);"></div>
    </div>
    <div style="height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px;">
      <span style="font-size: 12px; line-height: 1; font-weight: 800; letter-spacing: 1.6px; color: var(--ink);">ALIBI</span>
      <span style="font-size: 12px; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums;">Drawing · 19:31</span>
    </div>
    <div style="margin-top: 4px; padding: 0 4px; display: flex; align-items: center; gap: 12px;">
      <x-import component-from-global-scope="Alibi.Pinch" mood="focused" play="sideeye" force="{{ yes }}" size="{{ pinch }}" theme="dark" style="display: flex; width: 56px; height: 56px; flex: none;"></x-import>
      <p id="nudge-line" style="margin: 0; font-size: 15px; line-height: 1.4; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); text-wrap: pretty;">You said drawing. I've seen your <span class="al-cause">phone</span> for 3 minutes.</p>
    </div>
    <div style="margin-top: auto; padding: 0 4px; display: flex; align-items: center; gap: 8px;">
      <x-import component-from-global-scope="Alibi.Button" variant="primary" size="md" style="display: flex;">Back to it</x-import>
      <x-import component-from-global-scope="Alibi.Button" variant="secondary" size="md" style="display: flex;">This counts</x-import>
      <x-import component-from-global-scope="Alibi.Button" variant="quiet" size="md" style="display: flex;">Quiet 5 min</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return { pinch: 56, yes: true };
  }
}
</script>
</body>
</html>
