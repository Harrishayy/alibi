<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Island live wings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alibi/components/bundle.css">
<script src="ds/alibi/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 800px; height: 300px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-sans);">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--surface-1);"></div>
  <div style="position: absolute; top: 0; left: 0; right: 0; height: 32px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: var(--surface-2); font-size: 13px; line-height: 1;">
    <div style="display: flex; align-items: center; gap: 18px;">
      <span style="font-weight: 600;">Finder</span>
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; font-variant-numeric: tabular-nums;">
      <span aria-hidden="true" style="position: relative; width: 22px; height: 11px; box-sizing: border-box; border: 1px solid var(--ink-2); border-radius: 3px;">
        <span style="position: absolute; left: 1px; top: 1px; bottom: 1px; width: 14px; border-radius: 1px; background: var(--ink);"></span>
      </span>
      <span>Thu 1 Oct</span>
      <span>19:17</span>
    </div>
  </div>
  <div role="status" aria-label="Drawing, 24 minutes left, on task" style="position: absolute; top: 0; left: 261.5px; width: 277px; height: 32px; display: flex; align-items: center; background: var(--island); border-radius: 0 0 12px 12px;">
    <div aria-hidden="true" style="position: absolute; top: 0; left: -6px; width: 6px; height: 6px; overflow: hidden;">
      <div style="position: absolute; top: 0; left: -6px; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 6px var(--island);"></div>
    </div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: 100%; width: 6px; height: 6px; overflow: hidden;">
      <div style="position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 6px var(--island);"></div>
    </div>
    <div style="width: 46px; height: 32px; display: flex; align-items: center; justify-content: center;">
      <x-import component-from-global-scope="Alibi.Pinch" mood="focused" size="{{ wing }}" still="{{ yes }}" theme="dark" style="display: flex; width: 16px; height: 16px;"></x-import>
    </div>
    <div style="flex: 1 1 auto;"></div>
    <div style="width: 46px; height: 32px; display: flex; align-items: center; justify-content: center; font-family: var(--font-rounded); font-size: 13px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent-ink);">24m</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    return { wing: 16, yes: true };
  }
}
</script>
</body>
</html>
