<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Today, live</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/alibi/components/bundle.css">
<script src="ds/alibi/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--accent-ink)}a:hover{color:var(--ink)}
@keyframes ph-rise{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes ph-live{0%,100%{opacity:1}50%{opacity:0.45}}
</style>
</helmet>
<div data-theme="{{ theme }}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased;">

<div style="position: absolute; top: 59px; left: 0; right: 0; height: 44px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: flex-end;">
<x-import component-from-global-scope="Alibi.IconButton" icon="settings" sc-camel-aria-label="Settings" size="lg"></x-import>
</div>

<main style="position: absolute; top: 103px; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 0 20px 120px; display: flex; flex-direction: column;">

<header style="animation: ph-rise var(--dur-medium) var(--ease-out) both;">
<h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 600; letter-spacing: 0;">Today</h1>
<p style="margin: 2px 0 0; display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--ink-2);">
<span style="display: inline-flex; animation: ph-live 2400ms var(--ease-in-out) infinite;"><x-import component-from-global-scope="Alibi.StatusDot" label="on_task" size="{{ dot }}"></x-import></span>
<span>Live from Harrish&#39;s MacBook Pro</span>
</p>
</header>

<section aria-labelledby="session-h" style="margin-top: 20px; animation: ph-rise var(--dur-medium) var(--ease-out) 40ms both;">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
<h2 id="session-h" style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: 0;">Drawing</h2>
<span style="font-size: 15px; line-height: 20px; color: var(--ink-2); font-variant-numeric: tabular-nums;">25 min</span>
</div>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-2); font-variant-numeric: tabular-nums;">Started on your Mac at 19:21</p>
</section>

<section aria-label="Time left" style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between; animation: ph-rise var(--dur-medium) var(--ease-out) 80ms both;">
<x-import component-from-global-scope="Alibi.Pinch" mood="focused" size="{{ pinchSize }}" theme="{{ theme }}"></x-import>
<x-import component-from-global-scope="Alibi.RingTimer" progress="{{ progress }}" value="{{ timer }}" caption="left" size="{{ ringSize }}"></x-import>
</section>

<p style="margin: 12px 0 0; font-size: 17px; line-height: 22px; font-weight: 400; color: var(--ink); text-wrap: pretty; animation: ph-rise var(--dur-medium) var(--ease-out) 120ms both;">Six minutes in, pencil in hand. Nothing to flag.</p>

<section aria-label="Numbers" style="margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; animation: ph-rise var(--dur-medium) var(--ease-out) 160ms both;">
<x-import component-from-global-scope="Alibi.Card" padding="sm">
<div style="display: flex; flex-direction: column; gap: 12px;">
<x-import component-from-global-scope="Alibi.Stat" value="92%" label="On task" sub="Last seen 19:26"></x-import>
<x-import component-from-global-scope="Alibi.SampleStrip" labels="{{ samples }}" size="{{ stripSize }}" develop="{{ yes }}"></x-import>
</div>
</x-import>
<x-import component-from-global-scope="Alibi.Card" padding="sm">
<div style="display: flex; flex-direction: column; gap: 12px;">
<x-import component-from-global-scope="Alibi.Stat" value="3 of 5" label="Done today" sub="C++ next, 20:30"></x-import>
<div role="img" aria-label="3 of 5 habits done" style="display: flex; gap: 4px; height: 14px; align-items: center;">
<span style="flex: 1; height: 4px; border-radius: var(--radius-pill); background: var(--on-task);"></span>
<span style="flex: 1; height: 4px; border-radius: var(--radius-pill); background: var(--on-task);"></span>
<span style="flex: 1; height: 4px; border-radius: var(--radius-pill); background: var(--on-task);"></span>
<span style="flex: 1; height: 4px; box-sizing: border-box; border-radius: var(--radius-pill); border: 1px solid var(--hairline-strong);"></span>
<span style="flex: 1; height: 4px; box-sizing: border-box; border-radius: var(--radius-pill); border: 1px solid var(--hairline-strong);"></span>
</div>
</div>
</x-import>
</section>

<div style="margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; animation: ph-rise var(--dur-medium) var(--ease-out) 200ms both;">
<x-import component-from-global-scope="Alibi.Button" variant="secondary" size="lg" icon="cup" style="display: flex; flex-direction: column;">Take a break</x-import>
<x-import component-from-global-scope="Alibi.Button" variant="secondary" size="lg" icon="stop" style="display: flex; flex-direction: column;">Finish</x-import>
</div>

</main>

<nav aria-label="Alibi tabs" style="position: absolute; left: 24px; right: 24px; bottom: 24px; height: 64px; box-sizing: border-box; padding: 5px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; border-radius: var(--radius-pill); background: var(--surface-1); box-shadow: var(--shadow-float), inset 0 0 0 1px var(--hairline);">
<a href="Phone-Today-Live.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: var(--radius-pill); background: var(--surface-3); color: var(--accent-ink); text-decoration: none;">
<x-import component-from-global-scope="Alibi.Icon" name="clock" size="{{ tabIcon }}"></x-import>
<span style="font-size: 11px; line-height: 13px; font-weight: 600;">Today</span>
</a>
<a href="Phone-Week.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: var(--radius-pill); color: var(--ink-2); text-decoration: none;">
<x-import component-from-global-scope="Alibi.Icon" name="calendar" size="{{ tabIcon }}"></x-import>
<span style="font-size: 11px; line-height: 13px; font-weight: 600;">Week</span>
</a>
<a href="Phone-Health.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: var(--radius-pill); color: var(--ink-2); text-decoration: none;">
<x-import component-from-global-scope="Alibi.Icon" name="heart" size="{{ tabIcon }}"></x-import>
<span style="font-size: 11px; line-height: 13px; font-weight: 600;">Health</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.tick = setInterval(() => {
      const left = this.state && this.state.left != null ? this.state.left : 1122;
      if (left > 0) this.setState({ left: left - 1 });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.tick); }
  renderVals() {
    const total = 25 * 60;
    const left = this.state && this.state.left != null ? this.state.left : 1122;
    const mm = Math.floor(left / 60);
    const ss = String(left % 60).padStart(2, '0');
    return {
      theme: this.props.theme ?? 'dark',
      timer: mm + ':' + ss,
      progress: (total - left) / total,
      samples: ['on_task', 'on_task', 'idle', 'on_task', 'on_task', 'on_task'],
      pinchSize: 160,
      ringSize: 176,
      stripSize: 14,
      dot: 8,
      tabIcon: 24,
      yes: true
    };
  }
}
</script>
</body>
</html>
