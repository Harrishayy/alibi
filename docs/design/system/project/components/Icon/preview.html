<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title>
<style>
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: var(--space-1); padding: var(--space-4); }
  .cell { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-1); color: var(--ink); }
  .cell span { font-size: 12px; line-height: 1.3; color: var(--ink-3); white-space: nowrap; }
</style>
</head>
<body>
<div id="root" class="grid"></div>
<script>
  var A = window.Alibi, h = React.createElement;

  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    A.Icon.names.map(function (n) {
      return h('div', { key: n, className: 'cell' }, h(A.Icon, { name: n, size: 24 }), h('span', null, n));
    })));
</script>
</body>
</html>
