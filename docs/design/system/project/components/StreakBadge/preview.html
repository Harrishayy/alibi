<!doctype html>
<html>
<head><meta charset="utf-8"><title>StreakBadge — preview</title>
</head>
<body>
<div id="root" class="al-row"></div>
<script>
  var A = window.Alibi, h = React.createElement;

  function Demo() {
    var s = React.useState(6), d = s[0], set = s[1];
    return h(React.Fragment, null,
      h(A.StreakBadge, { days: d, freezes: 1 }),
      h(A.StreakBadge, { days: 1 }),
      h(A.StreakBadge, { days: 30, freezes: 2 }),
      h(A.Button, { variant: 'quiet', size: 'sm', icon: 'plus', onClick: function () { set(d + 1); } }, 'Add a day'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
