<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Pinch, a green detective lobster holding a magnifying lens (supportive)"><style>
.pb-fill{fill:var(--pinch-body,#76B900)}
.pb-belly{fill:var(--pinch-belly,#97DC42)}
.pb-shade{fill:var(--pinch-shade,#588C05)}
.pb-ol{fill:none;stroke:var(--pinch-outline,#365900);stroke-width:var(--pinch-ow,3);stroke-linejoin:round;stroke-linecap:round}
.pb-line{fill:none;stroke:var(--pinch-shade,#588C05);stroke-width:2.2;stroke-linecap:round}
.pb-eye{fill:var(--pinch-eye,#000)}
.pb-lash{fill:none;stroke:var(--pinch-lash,#365900);stroke-width:2;stroke-linecap:round}
.pb-shine{fill:var(--pinch-shine,#FFF)}
.pb-mouth{fill:none;stroke:var(--pinch-eye,#000);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pb-mouth-open{fill:var(--pinch-eye,#000)}
.pb-blush{fill:var(--pinch-blush,#F2A900);opacity:.4}
.pb-spark{fill:var(--pinch-spark,#AAF059)}
.pb-ant{fill:none;stroke-linecap:round}
.pb-ant-ol{stroke:var(--pinch-outline,#365900);stroke-width:calc(3.4 + var(--pinch-ow,3))}
.pb-ant-fill{stroke:var(--pinch-body,#76B900);stroke-width:3.4}
.pb-leg-ol{fill:none;stroke:var(--pinch-outline,#365900);stroke-width:calc(6.5 + var(--pinch-ow,3));stroke-linecap:round}
.pb-leg{fill:none;stroke:var(--pinch-shade,#588C05);stroke-width:6.5;stroke-linecap:round}
.pb-rim-ol{fill:none;stroke:var(--pinch-outline,#365900);stroke-width:calc(4.6 + var(--pinch-ow,3))}
.pb-rim{fill:none;stroke:var(--pinch-lens,#D7D7D7);stroke-width:4.6}
.pb-metal{fill:var(--pinch-lens,#D7D7D7)}
.pb-handle{fill:var(--pinch-lens-handle,#5E5E5E)}
.pb-glass{fill:rgba(255,255,255,.15)}
.pb-glint{fill:none;stroke:#FFF;stroke-width:2.2;stroke-linecap:round;opacity:.85}
.pb-glow-halo{fill:none;stroke:var(--pinch-lens-glow,#76B900);stroke-width:10;opacity:.4}
.pb-glow-glass{fill:var(--pinch-lens-glow,#76B900);opacity:.55}
.pb-sweat{fill:var(--pinch-lens,#D7D7D7)}
