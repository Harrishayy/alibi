<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Pinch, Alibi's detective lobster">
<style>
.pb{fill:var(--pinch-body,#76B900)}
.pl{fill:var(--pinch-belly,#97DC42)}
.ps{fill:var(--pinch-shade,#588C05)}
.po{stroke:var(--pinch-outline,#365900);stroke-width:var(--pinch-outline-w,2.6px);stroke-linejoin:round;stroke-linecap:round}
.pe{fill:var(--pinch-eye,#000)}
.pw{fill:var(--pinch-shine,#FFF)}
.pk{fill:var(--pinch-blush,#F2A900);opacity:.4}
.pz{fill:var(--pinch-spark,#AAF059)}
.pn{fill:none;stroke:var(--pinch-shade,#588C05);stroke-linecap:round}
.pm{fill:none;stroke:var(--pinch-eye,#000);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round}
.pc{fill:#5E5E5E}
.pcs{fill:none;stroke:var(--pinch-lens,#D7D7D7);stroke-opacity:.5;stroke-width:1.6px;stroke-linecap:round}
.lr{fill:none;stroke:var(--pinch-lens,#D7D7D7)}
.lh{fill:#5E5E5E}
.lg{fill:#FFF;fill-opacity:.15}
.lglow{fill:none;stroke:var(--pinch-lens-glow,#76B900);stroke-opacity:.45}
.sw{fill:var(--pinch-lens,#D7D7D7)}
</style>
