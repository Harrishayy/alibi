name: AlibiPhone
options:
  bundleIdPrefix: app.theultras
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 87P4DWU22Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AlibiPhone:
    type: application
    platform: iOS
    sources:
      - path: AlibiPhone
    resources:
      - path: Generated/AlibiConfig.plist
        optional: true
    entitlements:
      path: AlibiPhone/AlibiPhone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: AlibiPhone/Info.plist
      properties:
        CFBundleDisplayName: Alibi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.theultras.alibi.sync]
        NSHealthShareUsageDescription: "Alibi reads your steps, sleep, mindful minutes and workouts so it can check your health habits. Nothing leaves your home network except to your own Mac."
        NSHealthUpdateUsageDescription: "Alibi never writes to Health."
        NSLocalNetworkUsageDescription: "Alibi sends your daily Health totals to the Alibi app on your Mac."
        NSBonjourServices: [_http._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.theultras.alibi
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
