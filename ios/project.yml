name: AlibiPhone
options:
  bundleIdPrefix: app.theultras
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 87P4DWU22Q
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AlibiPhone:
    type: application
    platform: iOS
    sources:
      - path: AlibiPhone
      - path: Shared
      - path: Generated/AlibiConfig.plist
        buildPhase: resources
        optional: true
    entitlements:
      path: AlibiPhone/AlibiPhone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.app.theultras.alibi]
        com.apple.developer.family-controls: true
    dependencies:
      - target: AlibiActivityMonitor
      - target: AlibiShieldConfig
      - target: AlibiShieldAction
      - target: AlibiLive
    info:
      path: AlibiPhone/Info.plist
      properties:
        CFBundleDisplayName: Alibi
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.theultras.alibi.sync, app.theultras.alibi.live]
        NSHealthShareUsageDescription: "Alibi reads your activity, sleep, heart rate, mindful minutes, daylight, moods and workouts so it can check your habits. It only goes to the Alibi app on your own Mac."
        NSHealthUpdateUsageDescription: "Alibi never writes to Health."
        NSMotionUsageDescription: "Alibi notices whether you're still, walking or driving, and when you pick up your phone, so it can tell if a focus session really stayed focused."
        NSLocationWhenInUseUsageDescription: "Alibi saves your home as a small circle on this phone. Your Mac only ever learns at home: yes or no, never where you are."
        NSLocationAlwaysAndWhenInUseUsageDescription: "With Always, Alibi can notice when you leave or get home even while it's closed (for walk and gym habits, and away-from-desk checks). Only at home: yes/no is sent to your Mac."
        NSLocalNetworkUsageDescription: "Alibi sends your Health, motion and Focus updates to the Alibi app on your Mac."
        NSBonjourServices: [_http._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.theultras.alibi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  # Screen Time extensions (Family Controls). Embedded in the app; they talk to it only through the App Group.
  AlibiActivityMonitor:
    type: app-extension
    platform: iOS
    sources: [AlibiActivityMonitor, Shared]
    entitlements:
      path: AlibiActivityMonitor/AlibiActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.app.theultras.alibi]
    info:
      path: AlibiActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: Alibi Activity Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AlibiActivityMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.theultras.alibi.monitor
        GENERATE_INFOPLIST_FILE: NO
  AlibiShieldConfig:
    type: app-extension
    platform: iOS
    sources: [AlibiShieldConfig, Shared]
    entitlements:
      path: AlibiShieldConfig/AlibiShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.app.theultras.alibi]
    info:
      path: AlibiShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: Alibi Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AlibiShieldConfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.theultras.alibi.shieldconfig
        GENERATE_INFOPLIST_FILE: NO
  AlibiShieldAction:
    type: app-extension
    platform: iOS
    sources: [AlibiShieldAction]
    entitlements:
      path: AlibiShieldAction/AlibiShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.app.theultras.alibi]
    info:
      path: AlibiShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Alibi Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AlibiShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.theultras.alibi.shieldaction
        GENERATE_INFOPLIST_FILE: NO

  # Live Activity (Lock Screen + Dynamic Island). Sources share the iPhone app's theme, Pinch and attributes.
  AlibiLive:
    type: app-extension
    platform: iOS
    sources:
      - path: AlibiLive
      - path: AlibiPhone/Views/Live/AlibiLiveAttributes.swift
      - path: AlibiPhone/Views/Shared
        includes: [Theme.swift, Pinch.swift, PinchData.swift]
    info:
      path: AlibiLive/Info.plist
      properties:
        CFBundleDisplayName: Alibi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.theultras.alibi.live
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
