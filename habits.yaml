# An example week. Edit it from the Alibi dashboard, or here. Keys are what the agent maps your sentence to.
habits:
  drawing:
    modality: physical
    aliases:
    - draw
    - sketch
    - sketching
    - art
    weekly_target_min: 150
    default_min: 25
    on_task_looks_like: hands holding a pen or pencil working on paper or a drawing
      tablet
    schedule:
    - days:
      - mon
      - wed
      - fri
      at: '19:00'
      min: 25
    calendar: true
  piano:
    modality: physical
    aliases:
    - piano
    - keys
    - scales
    weekly_target_min: 180
    default_min: 30
    on_task_looks_like: hands on a piano or keyboard, sheet music on the stand
    schedule:
    - days:
      - mon
      - tue
      - thu
      - sat
      at: '18:00'
      min: 30
    calendar: true
  cooking:
    modality: physical
    aliases:
    - cook
    - cooking
    - bake
    - baking
    - meal prep
    weekly_target_min: 120
    default_min: 45
    on_task_looks_like: hands chopping, stirring or plating food at a kitchen counter
    schedule:
    - days:
      - wed
      - sun
      at: '18:30'
      min: 45
    calendar: true
  math:
    modality: hybrid
    aliases:
    - maths
    - math
    - calculus
    - linear algebra
    weekly_target_min: 240
    default_min: 30
    on_task_looks_like: writing equations in a notebook, or maths content on screen
    schedule:
    - days:
      - mon
      - tue
      - wed
      - thu
      - fri
      at: '11:00'
      min: 30
    calendar: true
  cpp:
    modality: digital
    aliases:
    - c++
    - cpp
    - learncpp
    weekly_target_min: 180
    default_min: 30
    on_task_looks_like: code editor with .cpp/.h files, cppreference, learncpp, compiler
      or terminal output
    schedule:
    - days:
      - mon
      - tue
      - wed
      - thu
      - fri
      at: '14:00'
      min: 30
    calendar: true
    repos:
    - ~/code/cpp
  running:
    source: strava
    weekly_sessions: 3
    min_km: 5.0
    schedule:
    - days:
      - tue
      - thu
      - sat
      at: '07:30'
      min: 30
    calendar: true
verdict:
  done: 0.7
  partial: 0.4
nudge_after_off_task_samples: 3
nudge_cooldown_min: 10
